<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Do Meu Jeito</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Do Meu Jeito">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#6F7741; --sup:#FAF7EA; --claro:#FBF8EC; --tinta:#1F2A14; --suave:#55603F; --linha:#DDDAC0;
  --verde:#2B4218; --verde-escuro:#1E2F11; --acafrao:#E3A92B; --framboesa:#B8324A; --rosa:#FFD9DF; --ok:#3B7A3A;
  --display:"Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --texto:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --borda:2px solid var(--verde);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--tinta);font:16px/1.5 var(--texto);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acafrao);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.lado{background:var(--verde-escuro);color:#EEF1DC;padding:28px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;z-index:10}
.marca{font-family:var(--display);font-weight:700;font-size:1.2rem;padding:0 12px 20px;display:flex;align-items:center;gap:10px}
.marca svg{width:34px;height:28px;flex:none}
.lado button.nav{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:8px;font-weight:500;opacity:.8;display:flex;justify-content:space-between;align-items:center}
.lado button.nav:hover{opacity:1;background:rgba(255,255,255,.08)}
.lado button.nav[aria-current="page"]{opacity:1;background:var(--acafrao);color:var(--tinta)}
.lado .conta{font-size:.78rem;font-weight:600;background:rgba(255,255,255,.16);border-radius:99px;padding:1px 8px}
.lado button.nav[aria-current="page"] .conta{background:rgba(31,42,20,.15)}
.lado .roda{margin:auto auto 6px;width:104px;flex:none}
@media (max-height:800px){.lado .roda{width:78px}}
@media (max-height:660px){.lado .roda{display:none}}
.lado .pe{padding:12px;font-size:.85rem;line-height:1.4}
.estado{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ponto{width:9px;height:9px;border-radius:50%;background:var(--acafrao);flex:none}
.ponto.ligado{background:#9BDB7C}
.lado .cfg{width:100%;background:none;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:8px 10px}
.lado .cfg:hover{background:rgba(255,255,255,.08)}

.palco{position:relative;min-width:0;overflow:hidden}
.enfeite{position:absolute;pointer-events:none;z-index:0}
.enfeite.e1{width:180px;top:-26px;right:84px;transform:rotate(24deg)}
.enfeite.e2{width:92px;top:16px;right:270px;transform:rotate(-16deg)}
.enfeite.e3{width:54px;top:58px;right:410px;transform:rotate(14deg)}
.enfeite.e4{width:96px;bottom:18px;right:60px;transform:rotate(14deg)}
.enfeite.e5{width:110px;bottom:10px;left:40px;transform:rotate(-28deg);opacity:.85}
main{position:relative;z-index:1;color:var(--claro);padding:104px clamp(18px,4vw,56px) 48px;max-width:1240px;width:100%}
.cena{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;max-width:1240px;padding:0 clamp(18px,4vw,56px) 26px}
.cena .canto{display:flex;align-items:flex-end;gap:10px;position:relative}
.cena .livros{width:200px} .cena .taca{width:66px} .cena .mala{width:140px} .cena .aviao{width:200px;margin-bottom:46px}
.cena .pouso{position:absolute;width:64px;left:96px;bottom:104px;transform:rotate(10deg)}
.cena .roda-m{display:none;width:70px}
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.resumo{font-size:1.1rem;color:#EEF0DA;margin-top:10px;max-width:60ch}
.resumo b{color:#fff;font-weight:600}
.resumo .alerta{color:var(--rosa)}

.btn{background:var(--verde);color:var(--claro);border:var(--borda);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--verde-escuro)}
.btn.sec{background:var(--sup);color:var(--verde)}
.btn.sec:hover{background:#EFEBD6}
.btn.perigo{background:var(--sup);color:var(--framboesa);border-color:var(--framboesa)}
.btn.mini{padding:4px 10px;font-size:.85rem}

.aviso{background:var(--sup);color:var(--tinta);border:var(--borda);border-left:8px solid var(--acafrao);padding:12px 16px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}

.rapida{display:flex;gap:8px;margin:22px 0 6px}
.rapida input{flex:1;min-width:0;border:var(--borda);background:var(--sup);color:var(--tinta);border-radius:8px;padding:12px 14px}
.dica{font-size:.85rem;color:#EEF0DA;margin-bottom:28px}
.dica code{background:rgba(255,255,255,.2);border-radius:4px;padding:1px 5px;font:inherit;font-weight:500}

.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sup);color:var(--tinta);border-radius:14px;overflow:hidden;border:var(--borda);margin-bottom:36px}
.dia{padding:14px 12px 18px;border-left:1px solid var(--linha);min-height:210px}
.dia:first-child{border-left:0}
.dia .cab{display:flex;align-items:baseline;gap:6px;margin-bottom:12px;color:var(--suave);font-size:.85rem}
.dia .num{font-family:var(--display);font-size:1.7rem;font-weight:600;color:var(--tinta);line-height:1}
.dia.hoje{background:var(--verde);color:var(--claro);border-left-color:var(--verde)}
.dia.hoje + .dia{border-left-color:var(--verde)}
.dia.hoje .cab{color:#D9DFBD}
.dia.hoje .num{color:var(--acafrao)}
.dia.passado{opacity:.6}
.item{font-size:.86rem;line-height:1.3;margin-bottom:10px;padding-left:9px;border-left:3px solid var(--linha)}
.item.ev{border-left-color:var(--verde)}
.item.tf{border-left-color:var(--acafrao)}
.item.es{border-left-color:#7A5BA8}
.item.vg{border-left-color:var(--framboesa)}
.dia.hoje .item.ev{border-left-color:#B5C283}
.item small{display:block;opacity:.75;font-size:.78rem}
.vazio-dia{font-size:.82rem;opacity:.6}

.duas{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:40px}
.bloco h2{margin-bottom:12px}
.painel{background:var(--sup);color:var(--tinta);border:var(--borda);border-radius:14px;padding:18px}
.lista{list-style:none;margin:0;padding:2px 16px;background:var(--sup);color:var(--tinta);border:var(--borda);border-radius:14px}
.lista li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linha)}
.lista li:last-child{border-bottom:0}
.lista .corpo{flex:1;min-width:0}
.lista .corpo button.abre{background:none;border:0;padding:0;text-align:left;font-weight:500;width:100%}
.lista .corpo button.abre:hover{color:var(--ok)}
.meta{font-size:.84rem;color:var(--suave)}
.meta .venc{color:var(--framboesa);font-weight:600}
.feito .abre{text-decoration:line-through;color:var(--suave);font-weight:400}
.marcar{width:22px;height:22px;border-radius:50%;border:2px solid var(--verde);background:#fff;flex:none;margin-top:2px;padding:0;position:relative}
.marcar.sim{background:var(--ok);border-color:var(--verde)}
.marcar.sim::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.valor{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.valor.neg{color:var(--framboesa)} .valor.pos{color:var(--ok)}
.etq{display:inline-block;font-size:.76rem;font-weight:600;border-radius:99px;padding:1px 9px;background:var(--linha);color:var(--tinta)}
.etq.alta{background:#F6D9DF;color:#8C1F36}
.etq.media{background:#F8E6B4;color:#6E4E05}
.vazio{padding:22px 2px;color:var(--claro)}

.numeros{margin:0;padding:2px 16px;background:var(--sup);color:var(--tinta);border:var(--borda);border-radius:14px}
.numeros div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--linha)}
.numeros div:last-child{border-bottom:0}
.numeros dt{color:var(--suave)} .numeros dd{margin:0;font-weight:600;text-align:right}

.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filtros button{border:var(--borda);background:var(--sup);color:var(--tinta);border-radius:99px;padding:4px 13px;font-size:.9rem}
.filtros button[aria-pressed="true"]{background:var(--verde);color:var(--claro)}
.grupo{margin-bottom:30px}
.grupo > h3{color:var(--claro);margin-bottom:8px;font-family:var(--texto);font-size:.95rem}
.grupo.venc > h3{color:var(--rosa)}

.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.cartao{background:var(--sup);color:var(--tinta);border:var(--borda);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.cartao h3{font-size:1.15rem}
.cartao button.abre{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.cartao button.abre:hover{color:var(--ok)}
.barra{height:8px;background:var(--linha);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px}
.contagem{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--verde);line-height:1}

.totais{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:var(--borda);border-radius:14px;background:var(--sup);color:var(--tinta);margin-bottom:28px;overflow:hidden}
.totais div{padding:16px 18px;border-left:1px solid var(--linha)}
.totais div:first-child{border-left:0}
.totais span{display:block;color:var(--suave);font-size:.88rem}
.totais strong{font-family:var(--display);font-size:1.45rem;font-weight:600}
.mes{display:flex;align-items:center;gap:10px}
.mes button{border:var(--borda);background:var(--sup);color:var(--tinta);border-radius:8px;width:36px;height:36px;padding:0}
.mes b{min-width:150px;text-align:center}
.cat{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:.9rem;margin-bottom:9px}
.cat:last-child{margin-bottom:0}

.habitos{width:100%;border-collapse:separate;border-spacing:0;background:var(--sup);color:var(--tinta);border:var(--borda);border-radius:14px;overflow:hidden}
.habitos th,.habitos td{padding:11px 8px;border-bottom:1px solid var(--linha);text-align:center;font-weight:400}
.habitos th{font-size:.82rem;color:var(--suave)}
.habitos th.hj{color:var(--verde);font-weight:700}
.habitos td:first-child,.habitos th:first-child{text-align:left;padding-left:16px}
.habitos tr:last-child td{border-bottom:0}
.habitos .marcar{margin:0;border-radius:7px}
.habitos button.abre{background:none;border:0;padding:0;font-weight:500;text-align:left}

dialog{border:var(--borda);border-radius:16px;padding:0;width:min(540px,94vw);background:var(--sup);color:var(--tinta);box-shadow:0 24px 60px rgba(20,32,10,.45)}
dialog::backdrop{background:rgba(25,36,14,.6)}
dialog form,dialog .dentro{padding:26px}
dialog h2{margin-bottom:18px}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-size:.88rem;font-weight:600;margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;border:1.5px solid var(--verde);border-radius:8px;padding:9px 11px;background:#fff}
.anexos{list-style:none;margin:0 0 8px;padding:0}
.anexos li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--linha)}
.anexos a{color:var(--verde);font-weight:600;word-break:break-all}
dialog form{max-height:90vh;overflow:auto}
.acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.acoes .esq{margin-right:auto}
.passos{padding-left:20px;margin:0 0 16px}
.passos li{margin-bottom:9px}
.passos code{background:var(--linha);border-radius:4px;padding:1px 5px;font-size:.9em}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--verde-escuro);color:#fff;border:2px solid var(--acafrao);padding:11px 18px;border-radius:10px;font-weight:500;z-index:50;max-width:90vw}
.toast.erro{background:var(--framboesa);border-color:#fff}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .lado{height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:2px;align-items:center}
  .marca span,.lado .roda{display:none}
  .marca{padding:0 6px 0 4px}
  .lado button.nav{white-space:nowrap;gap:6px}
  .lado .pe{margin:0 0 0 auto;padding:0;display:flex;align-items:center;gap:8px}
  .lado .pe .txt{display:none}
  .estado{margin:0}
  .lado .cfg{white-space:nowrap;width:auto;margin:0 !important}
  main{padding-top:84px;padding-bottom:36px}
  .cena{gap:8px}
  .cena .roda-m{display:block;flex:none}
  .cena .roda-m ~ .canto,.cena .canto{flex:none}
  .cena .livros{width:112px} .cena .taca{width:38px} .cena .mala{width:78px} .cena .aviao{display:none}
  .cena .roda-m{width:54px}
  .cena .pouso{width:38px;left:50px;bottom:58px}
  .enfeite.e1{width:130px;top:-12px;right:6px}
  .enfeite.e2{width:62px;top:14px;right:150px}
  .enfeite.e3{display:none}
  .semana{grid-template-columns:1fr}
  .dia{border-left:0;border-top:1px solid var(--linha);min-height:0;padding-bottom:8px}
  .dia:first-child{border-top:0}
  .duas{grid-template-columns:1fr;gap:28px}
  .totais{grid-template-columns:1fr 1fr}
  .totais div:nth-child(3){border-left:0}
  .totais div:nth-child(n+3){border-top:1px solid var(--linha)}
  .habitos th,.habitos td{padding:9px 3px}
}
@media (prefers-reduced-motion:no-preference){
  .marcar{transition:background .15s}
  .enfeite.e2{animation:pousar 7s ease-in-out infinite alternate}
  @keyframes pousar{from{transform:rotate(-16deg) translateY(0)}to{transform:rotate(-9deg) translateY(8px)}}
}
</style>
</head>

<script type="text/plain" id="gas">/* Do Meu Jeito — script da planilha (Google Apps Script)
   1. Cole este código em Extensões > Apps Script e salve.
   2. Execute a função "configurar" uma vez (cria as abas).
   3. Implantar > Nova implantação > App da Web
      Executar como: Eu | Quem pode acessar: Qualquer pessoa
   4. Copie o URL do app da Web (termina em /exec) e cole no painel. */

const PASTA_ANEXOS = 'Do Meu Jeito - Anexos';
const ABAS = {
  Tarefas:  ['id','titulo','area','prioridade','prazo','status','notas','anexos'],
  Agenda:   ['id','titulo','data','inicio','fim','local','status','anexos'],
  Financas: ['id','descricao','tipo','valor','data','categoria','status','dividir_com','quem_pagou','acertado','anexos'],
  Estudos:  ['id','atividade','disciplina','tipo','prazo','status','anexos'],
  Habitos:  ['id','habito','meta_semanal','registros','anexos'],
  Projetos: ['id','projeto','area','status','progresso','proximo_passo','prazo','anexos'],
  Viagens:  ['id','destino','ida','volta','status','orcamento','notas','anexos']
};

function configurar() {
  const ss = SpreadsheetApp.getActive();
  Object.keys(ABAS).forEach(function (nome) {
    const sh = ss.getSheetByName(nome) || ss.insertSheet(nome);
    sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).setNumberFormat('@');
    if (sh.getLastRow() === 0) {
      sh.appendRow(ABAS[nome]);
      sh.getRange(1, 1, 1, ABAS[nome].length).setFontWeight('bold');
      sh.setFrozenRows(1);
    } else {
      const cab = sh.getRange(1, 1, 1, sh.getLastColumn()).getDisplayValues()[0];
      ABAS[nome].forEach(function (c) {
        if (cab.indexOf(c) < 0) sh.getRange(1, sh.getLastColumn() + 1).setValue(c).setFontWeight('bold');
      });
    }
  });
  DriveApp.getRootFolder();
}

function lerTudo() {
  const ss = SpreadsheetApp.getActive();
  const dados = {};
  Object.keys(ABAS).forEach(function (nome) {
    const sh = ss.getSheetByName(nome);
    dados[nome] = [];
    if (!sh || sh.getLastRow() < 2) return;
    const v = sh.getDataRange().getDisplayValues();
    const cab = v[0];
    const colId = cab.indexOf('id');
    for (let i = 1; i < v.length; i++) {
      if (v[i].join('') === '') continue;
      if (colId >= 0 && !v[i][colId]) {
        v[i][colId] = Utilities.getUuid().slice(0, 8);
        sh.getRange(i + 1, colId + 1).setValue(v[i][colId]);
      }
      const o = {};
      cab.forEach(function (c, j) { if (c) o[c] = v[i][j]; });
      dados[nome].push(o);
    }
  });
  return dados;
}

function doGet() { return json({ ok: true, dados: lerTudo() }); }

function doPost(e) {
  const trava = LockService.getScriptLock();
  trava.waitLock(15000);
  try {
    const p = JSON.parse(e.postData.contents);
    if (!ABAS[p.aba]) return json({ ok: false, erro: 'Aba desconhecida' });
    if (p.acao === 'anexar') {
      const it = DriveApp.getFoldersByName(PASTA_ANEXOS);
      const pasta = it.hasNext() ? it.next() : DriveApp.createFolder(PASTA_ANEXOS);
      const arq = pasta.createFile(Utilities.newBlob(Utilities.base64Decode(p.base64), p.tipo || 'application/octet-stream', p.nome));
      return json({ ok: true, url: arq.getUrl() });
    }
    const sh = SpreadsheetApp.getActive().getSheetByName(p.aba);
    const cab = sh.getRange(1, 1, 1, sh.getLastColumn()).getDisplayValues()[0];
    const limpa = function (x) { x = x == null ? '' : String(x); return x.charAt(0) === '=' ? "'" + x : x; };
    if (p.acao === 'adicionar') {
      sh.appendRow(cab.map(function (c) { return limpa(p.linha[c]); }));
      return json({ ok: true });
    }
    const colId = cab.indexOf('id');
    const ids = sh.getRange(1, colId + 1, sh.getLastRow(), 1).getDisplayValues();
    let lin = -1;
    for (let i = 1; i < ids.length; i++) if (ids[i][0] === String(p.id)) { lin = i + 1; break; }
    if (lin < 0) return json({ ok: false, erro: 'Linha não encontrada' });
    if (p.acao === 'excluir') sh.deleteRow(lin);
    if (p.acao === 'atualizar') {
      Object.keys(p.campos).forEach(function (c) {
        const j = cab.indexOf(c);
        if (j >= 0 && c !== 'id') sh.getRange(lin, j + 1).setValue(limpa(p.campos[c]));
      });
    }
    return json({ ok: true });
  } catch (err) {
    return json({ ok: false, erro: String(err) });
  } finally {
    trava.releaseLock();
  }
}

/* Alertas: execute "ativarAlertas" uma vez. Todo dia, por volta das 8h, você recebe um e-mail
   com contas a vencer, viagens próximas, tarefas, entregas e compromissos. */
function ativarAlertas() {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'alertaDiario') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('alertaDiario').timeBased().everyDays(1).atHour(8)
    .inTimezone(SpreadsheetApp.getActive().getSpreadsheetTimeZone()).create();
  alertaDiario(true);
}
function desativarAlertas() {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'alertaDiario') ScriptApp.deleteTrigger(t); });
}
function paraData(s) {
  s = String(s || '').trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (m) return Date.UTC(+m[1], m[2] - 1, +m[3]);
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s); if (m) return Date.UTC(+m[3], m[2] - 1, +m[1]);
  return null;
}
function alertaDiario(teste) {
  const d = lerTudo();
  const hoje = paraData(Utilities.formatDate(new Date(), SpreadsheetApp.getActive().getSpreadsheetTimeZone(), 'yyyy-MM-dd'));
  const dias = function (s) { const x = paraData(s); return x === null ? null : Math.round((x - hoje) / 864e5); };
  const quando = function (n) { return n < 0 ? 'venceu há ' + (-n) + (n === -1 ? ' dia' : ' dias') : n === 0 ? 'hoje' : n === 1 ? 'amanhã' : 'em ' + n + ' dias'; };
  const feito = function (s) { return /^(conclu|pago)/i.test(s || ''); };
  const linhas = [];
  d.Financas.forEach(function (f) { const n = dias(f.data); if (f.tipo !== 'receita' && !feito(f.status) && n !== null && n <= 3) linhas.push('Conta: ' + f.descricao + ' (R$ ' + f.valor + '), ' + quando(n)); });
  d.Viagens.forEach(function (v) { const n = dias(v.ida); if (!feito(v.status) && n !== null && n >= 0 && n <= 7) linhas.push('Viagem: ' + v.destino + ', ' + quando(n)); });
  d.Agenda.forEach(function (a) { const n = dias(a.data); if (!feito(a.status) && (n === 0 || n === 1)) linhas.push('Compromisso: ' + a.titulo + (a.inicio ? ' às ' + a.inicio : '') + ', ' + quando(n)); });
  d.Tarefas.forEach(function (t) { const n = dias(t.prazo); if (!feito(t.status) && n !== null && n <= 1) linhas.push('Tarefa: ' + t.titulo + ', ' + quando(n)); });
  d.Estudos.forEach(function (e) { const n = dias(e.prazo); if (!feito(e.status) && n !== null && n <= 2) linhas.push('Estudo: ' + e.atividade + ', ' + quando(n)); });
  if (!linhas.length) { if (teste !== true) return; linhas.push('Nada vence nos próximos dias. Este e-mail é só um teste: os alertas estão ativados.'); }
  MailApp.sendEmail(Session.getEffectiveUser().getEmail(), 'Do Meu Jeito: ' + linhas.length + (linhas.length === 1 ? ' alerta' : ' alertas'), linhas.join('\n'));
}

function json(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
</script>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const mais = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const deIso = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
function normData(s) {
  s = String(s ?? '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(s);
  if (!m) return '';
  let a = m[3] ? +m[3] : hoje().getFullYear(); if (a < 100) a += 2000;
  return iso(new Date(a, +m[2]-1, +m[1]));
}
function num(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[^\d,.-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}
const reais = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataCurta = s => { const d = deIso(s); return d ? d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '') : ''; };
const dias = s => { const d = deIso(s); return d ? Math.round((d - hoje()) / 864e5) : null; };
function prazoTxt(s) {
  const n = dias(s); if (n === null) return '';
  if (n < 0) return `<span class="venc">venceu há ${-n} ${n === -1 ? 'dia' : 'dias'}</span>`;
  if (n === 0) return 'hoje'; if (n === 1) return 'amanhã';
  return dataCurta(s);
}
const feito = r => /^(conclu|pago)/i.test(r.status || '');
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const anexosDe = r => String(r.anexos || '').split('\n').map(l => { const i = l.lastIndexOf(' | '); return i < 0 ? null : { n: l.slice(0, i), u: l.slice(i + 3) }; }).filter(Boolean);
const anexosTxt = l => l.map(a => a.n + ' | ' + a.u).join('\n');
const clipe = r => { const n = anexosDe(r).length; return n ? n + (n === 1 ? ' anexo' : ' anexos') : ''; };
/* Divisão no estilo Splitwise: "Marina, Paulo" divide em partes iguais; "Marina 30%" ou "Marina 50,00" fixa a parte da pessoa. */
function divisao(f) {
  const partes = {}; if (f.tipo === 'receita') return { partes, minha: f.valor };
  const livres = []; let fixo = 0;
  String(f.dividir_com || '').split(/[,;]\s*(?=\D)/).map(s => s.trim()).filter(Boolean).forEach(t => {
    const m = /^(.*?)\s*(?:R\$\s*)?(\d[\d.,]*)\s*(%?)$/.exec(t);
    if (m && m[1].trim()) { const v = m[3] ? f.valor * num(m[2]) / 100 : num(m[2]); partes[m[1].trim()] = v; fixo += v; }
    else { partes[t] = 0; livres.push(t); }
  });
  const resto = Math.max(0, f.valor - fixo);
  if (livres.length) { const cada = resto / (livres.length + 1); livres.forEach(n => partes[n] = cada); return { partes, minha: cada }; }
  return { partes, minha: resto };
}
const pessoas = f => Object.keys(divisao(f).partes);
const minhaParte = f => divisao(f).minha;
const acertadoCom = (f, n) => { const s = semAcento(f.acertado); return s === 'sim' || s === 'todos' || s.split(/[,;]/).map(x => x.trim()).includes(semAcento(n)); };
const euPaguei = f => !f.quem_pagou || semAcento(f.quem_pagou) === 'eu';
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function normalizar(bruto) {
  const out = {};
  for (const aba in SCHEMA) {
    out[aba] = (bruto[aba] || []).map(r => {
      const o = Object.assign({}, r); o.id = String(o.id || novoId());
      SCHEMA[aba].campos.forEach(c => {
        if (c.t === 'date') o[c.k] = normData(o[c.k]);
        else if (c.t === 'number') o[c.k] = num(o[c.k]);
        else o[c.k] = String(o[c.k] ?? '');
      });
      o.anexos = String(o.anexos ?? '');
      return o;
    });
  }
  return out;
}

let fila = Promise.resolve();
async function carregar() {
  S.url = guarda.get('painel.url');
  if (!S.url) { S.exemplo = true; S.dados = exemplo(); return desenhar(); }
  $('#main').innerHTML = '<p class="vazio">Carregando a planilha…</p>';
  try {
    const r = await fetch(S.url); const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'resposta inválida');
    S.dados = normalizar(j.dados); S.exemplo = false;
  } catch (e) {
    S.exemplo = true; S.dados = exemplo();
    aviso('Não consegui ler a planilha. Confira o endereço em "Conectar planilha".', true);
  }
  desenhar();
}
function enviar(p) {
  if (S.exemplo) return;
  fila = fila.then(async () => {
    try {
      const r = await fetch(S.url, { method: 'POST', body: JSON.stringify(p) });
      const j = await r.json(); if (!j.ok) throw new Error(j.erro);
    } catch (e) { aviso('A alteração não foi salva na planilha. Recarregue a página e tente de novo.', true); }
  });
}
function postar(p) {
  const r = fila.then(async () => { const x = await fetch(S.url, { method: 'POST', body: JSON.stringify(p) }); const j = await x.json(); if (!j.ok) throw new Error(j.erro); return j; });
  fila = r.catch(() => {}); return r;
}

function tarefaRapida(txt) {
  const t = { titulo: '', area: 'Pessoal', prioridade: 'média', prazo: '', status: 'a fazer', notas: '', anexos: '' }, h = hoje();
  const sem = { dom: 0, seg: 1, ter: 2, qua: 3, qui: 4, sex: 5, sab: 6 };
  const resto = [];
  txt.trim().split(/\s+/).forEach(p => {
    const s = semAcento(p);
    if (p[0] === '#' && p.length > 1) { t.area = AREAS.find(a => semAcento(a).startsWith(s.slice(1))) || t.area; }
    else if (p[0] === '!' && p.length > 1) { t.prioridade = s.startsWith('!a') ? 'alta' : s.startsWith('!b') ? 'baixa' : 'média'; }
    else if (s === 'hoje') t.prazo = iso(h);
    else if (s === 'amanha') t.prazo = iso(mais(h, 1));
    else if (s in sem) { const n = (sem[s] - h.getDay() + 7) % 7; t.prazo = iso(mais(h, n)); }
    else if (/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(p)) t.prazo = normData(p);
    else resto.push(p);
  });
  t.titulo = resto.join(' '); return t;
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, aba = b.dataset.aba, id = b.dataset.id;
  if (a === 'ir') { S.vista = b.dataset.v; desenhar(); $('#main').focus({ preventScroll: true }); window.scrollTo(0, 0); }
  else if (a === 'novo') abrirForm(aba);
  else if (a === 'editar') abrirForm(aba, id);
  else if (a === 'fechar') $('#dlg').close();
  else if (a === 'excluir') { $('#dlg').close(); excluir(aba, id); aviso('Excluído'); }
  else if (a === 'marcar') { const r = D(aba).find(x => x.id === id); if (!r) return;
    const era = feito(r); atualizar(aba, id, { status: SIT[aba][era ? 0 : 1] }); if (aba !== 'Financas') aviso(era ? 'Reaberto' : 'Concluído. Continua guardado na planilha.'); }
  else if (a === 'ver') { S.ver[aba] = !S.ver[aba]; desenhar(); }
  else if (a === 'habito') { const r = D('Habitos').find(x => x.id === id); if (!r) return; const d = b.dataset.d;
    let reg = (r.registros || '').split(',').filter(Boolean); reg = reg.includes(d) ? reg.filter(x => x !== d) : [...reg, d];
    atualizar('Habitos', id, { registros: reg.sort().slice(-120).join(',') }); }
  else if (a === 'tirar-anexo') { const r = D(aba).find(x => x.id === id); if (!r) return; const l = anexosDe(r); l.splice(+b.dataset.i, 1); atualizar(aba, id, { anexos: anexosTxt(l) }); abrirForm(aba, id); }
  else if (a === 'acertar') { const n = b.dataset.n;
    D('Financas').filter(f => pessoas(f).length && !acertadoCom(f, n) && (euPaguei(f) ? pessoas(f).includes(n) : f.quem_pagou.trim() === n))
      .forEach(f => atualizar('Financas', f.id, { acertado: [f.acertado, n].filter(Boolean).join(', ') }));
    aviso('Contas com ' + n + ' acertadas'); }
  else if (a === 'filtro') { S.filtro = b.dataset.f; desenhar(); }
  else if (a === 'mes') { const [y, m] = S.mes.split('-').map(Number); const d = new Date(y, m - 1 + (+b.dataset.n), 1); S.mes = iso(d).slice(0, 7); desenhar(); }
  else if (a === 'config') abrirConfig();
  else if (a === 'musica') musica(som.paused);
  else if (a === 'copiar') { const s = $('#gas').textContent; (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => aviso('Script copiado'), () => aviso('Não consegui copiar. Abra o arquivo index.html e copie o trecho do script.', true)); }
  else if (a === 'conectar') { const u = $('#urlPlan').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return aviso('O endereço precisa começar com https://script.google.com e terminar em /exec.', true);
    guarda.set('painel.url', u); $('#dlg').close(); carregar(); }
  else if (a === 'desconectar') { guarda.set('painel.url', ''); $('#dlg').close(); carregar(); }
});
document.addEventListener('change', async ev => {
  const inp = ev.target; if (!inp.matches || !inp.matches('[data-anexo]')) return;
  const arq = inp.files[0]; if (!arq) return; const aba = inp.dataset.aba, id = inp.dataset.id;
  if (arq.size > 10 * 1024 * 1024) { inp.value = ''; return aviso('O arquivo passa de 10 MB. Escolha um menor.', true); }
  let url;
  if (S.exemplo) url = URL.createObjectURL(arq);
  else { aviso('Enviando o anexo…'); inp.disabled = true;
    try { url = (await postar({ acao: 'anexar', aba, id, nome: arq.name, tipo: arq.type, base64: await lerBase64(arq) })).url; }
    catch (e) { inp.disabled = false; return aviso('O anexo não foi enviado. Confira a conexão e se o script da planilha está atualizado.', true); } }
  const r = D(aba).find(x => x.id === id); if (!r) return;
  const l = anexosDe(r); l.push({ n: arq.name.replace(/[\n|]/g, ' '), u: url });
  atualizar(aba, id, { anexos: anexosTxt(l) }); aviso('Anexo adicionado'); if ($('#dlg').open) abrirForm(aba, id);
});
document.addEventListener('submit', ev => {
  const f = ev.target;
  if (f.dataset.f === 'rapida') { ev.preventDefault(); const t = tarefaRapida(f.q.value); if (!t.titulo) return; adicionar('Tarefas', t); aviso('Tarefa adicionada'); }
  else if (f.dataset.f === 'registro') {
    if (ev.submitter && ev.submitter.value !== 'ok') return;
    const aba = f.dataset.aba, id = f.dataset.id, o = {};
    SCHEMA[aba].campos.forEach(c => { const v = f.elements[c.k].value; o[c.k] = c.t === 'number' ? num(v) : v.trim(); });
    if (id) atualizar(aba, id, o); else { (SCHEMA[aba].ocultos || []).forEach(k => o[k] = ''); o.anexos = ''; adicionar(aba, o); }
    aviso('Salvo');
  }
});
carregar();
</script>
